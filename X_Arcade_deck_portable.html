:root{
  --bg:#04070B;--bgAlt:#0B141E;--ink:#E8F6FB;--inkDim:#93A9B9;
  --accent:#22D3EE;--accent2:#FF2D55;--pcrf:#67E8F9;--pigrpo:#FF2D55;
  --good:#4ADE80;--warn:#FBBF24;--grid:#16303E;
  --fh:'Space Grotesk',sans-serif;--fb:'Inter',sans-serif;--fm:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#030509;color:var(--ink);font-family:var(--fb);overflow:hidden}
#stageWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;background:var(--bg);overflow:hidden;
  box-shadow:0 30px 120px rgba(0,0,0,.65);transform-origin:center center}
#progress{position:absolute;top:0;left:0;height:3px;background:var(--accent);z-index:40;transition:width .3s ease}
.slide{position:absolute;inset:0;padding:58px 80px 76px;display:none;flex-direction:column;opacity:0}
.slide.active{display:flex;opacity:1}
.kicker{font-family:var(--fm);font-size:13px;letter-spacing:.20em;text-transform:uppercase;color:var(--inkDim);
  display:flex;align-items:center;gap:10px;margin-bottom:22px}
.kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--sys,var(--accent));box-shadow:0 0 12px var(--sys,var(--accent))}
h1.title{font-family:var(--fh);font-weight:600;font-size:40px;line-height:1.11;letter-spacing:-.02em;max-width:27ch}
.title .em{color:var(--sys,var(--accent))}
.titleRule{width:64px;height:2px;background:var(--sys,var(--accent));margin-top:16px;border-radius:2px}
.body{margin-top:24px;display:flex;flex-direction:column;gap:12px;max-width:62ch}
.body li{list-style:none;position:relative;padding-left:22px;font-size:19px;line-height:1.42;color:#dcecf5}
.body li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:1.5px;background:var(--sys,var(--accent))}
.hl{display:flex;gap:34px;margin-top:auto;padding-top:20px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:3px}
.stat .v{font-family:var(--fh);font-weight:600;font-size:28px;color:var(--ink);letter-spacing:-.01em}
.stat .l{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--inkDim)}
.foot{position:absolute;left:80px;right:80px;bottom:28px;display:flex;justify-content:space-between;align-items:center;
  font-family:var(--fm);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--inkDim);
  border-top:1px solid var(--grid);padding-top:11px}
.foot .sec{color:var(--sys,var(--inkDim))}
.layout-title{justify-content:center}
.layout-title h1.title{font-size:54px;max-width:23ch}
.layout-title .sub{margin-top:20px;font-size:19px;color:var(--inkDim);max-width:75ch;line-height:1.5}
.layout-closing{justify-content:center}
.layout-closing h1.title{font-size:46px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:center;flex:1;margin-top:6px}
.split .col-r{align-self:stretch;display:flex;align-items:center;justify-content:center;min-width:0}
.chartWrap{flex:1;margin-top:16px;display:flex;flex-direction:column;min-height:0}
.chartWrap svg{width:100%;flex:1;min-height:260px}
.split .chartWrap{width:100%;margin-top:0}
.cap{font-size:12px;color:var(--inkDim);margin-top:8px;line-height:1.4;max-width:100ch}
.figWrap{flex:1;margin-top:13px;display:flex;flex-direction:column;align-items:center;min-height:0}
.figWrap img{max-width:100%;max-height:360px;object-fit:contain;border:1px solid var(--grid);border-radius:9px;background:#0b141e}
.split .figWrap{margin-top:0;justify-content:center}
table.tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px;table-layout:fixed}
table.tbl th,table.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--grid);vertical-align:top;line-height:1.35;overflow-wrap:anywhere}
table.tbl thead th{font-family:var(--fm);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--inkDim)}
table.tbl td:first-child{font-family:var(--fm);font-size:13px;color:var(--accent);width:32%}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:rgba(8,11,20,.97);
  border-top:2px solid var(--accent);padding:18px 26px;z-index:60;display:none;backdrop-filter:blur(6px)}
#notes.show{display:block}
#notes .nh{font-family:var(--fm);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
#notes .nb{font-size:15px;line-height:1.6;color:#cdd6ea;max-width:120ch}
#hud{position:fixed;right:14px;top:12px;z-index:60;font-family:var(--fm);font-size:11px;color:var(--inkDim);letter-spacing:.1em;display:flex;gap:14px}
.navbtn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;width:54px;height:54px;border-radius:50%;
  background:rgba(18,24,41,.86);border:1px solid var(--grid);color:var(--ink);font-size:26px;display:none;align-items:center;justify-content:center}
#prevBtn{left:calc(14px + env(safe-area-inset-left))}#nextBtn{right:calc(14px + env(safe-area-inset-right))}
#rotateHint{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:14px;padding:40px;background:rgba(5,7,13,.95);color:var(--ink)}
#rotateHint .ic{font-size:56px;color:var(--accent)}
#rotateHint .t{font-family:var(--fh);font-weight:600;font-size:23px}
#rotateHint .s{color:var(--inkDim);font-size:15px;max-width:32ch;line-height:1.55}

<script>
const PAL={"bg": "#04070B", "bgAlt": "#0B141E", "ink": "#E8F6FB", "inkDim": "#93A9B9", "accent": "#22D3EE", "accent2": "#FF2D55", "pcrf": "#67E8F9", "pigrpo": "#FF2D55", "good": "#4ADE80", "warn": "#FBBF24", "grid": "#16303E"},SLIDES=[{"n": 1, "section": "OPENING", "kicker": "X ARCADE / GROKATHON", "title": "X's biggest embarrassment, *now a game*", "layout": "title", "body": ["X suspends about 208 bot accounts a minute (reported, Apr 2026)", "Spotting the fake is already entertainment on X", "X Arcade turns it into a two-player game"], "highlights": [{"label": "Bot suspensions, reported", "value": "~208/min"}, {"label": "Flagship cartridge", "value": "Decoy"}, {"label": "One round", "value": "30s"}], "chartRef": "", "figureRef": "", "equations": [], "notes": "Open on the number. In April 2026 Nikita Bier said X was suspending roughly 208 bot accounts every minute (x.com/nikitabier/status/2042121229998682517). That figure and the other market claims in this deck come from the research sweep of public reporting. They are quoted as reported, not measured by us. Second beat: in November 2025 the About this account feature went viral as spot-the-fake entertainment. People already play this game for free in the quote tweets. X Arcade gives it a scoreboard. The line to land: we turned X's biggest embarrassment into a game."}, {"n": 2, "section": "THE GAP", "kicker": "AN UNOWNED ROADMAP", "title": "Nobody owns games at X *this week*", "layout": "default", "body": ["X has never shipped a game in twenty years", "Musk promised an xAI-studio AI game by end of 2026", "That promise is still unshipped", "X's head of product resigned on 5 August", "WeChat shows mini-games can anchor a super app", "Source: research sweep, public reporting"], "highlights": [{"label": "Games shipped by X", "value": "0"}, {"label": "The 2026 promise", "value": "Unshipped"}, {"label": "Product head resigned", "value": "Aug 5"}], "chartRef": "", "figureRef": "", "equations": [], "notes": "Three reported facts make the lane. First, X has never shipped a game on the platform in twenty years. Second, Musk publicly promised an AI-generated game from an xAI studio by the end of 2026, and nothing has shipped. Third, the head of product resigned two days ago, on 5 August, so the roadmap that would own this is unowned this week. WeChat is the model to name: its mini-game layer is a load-bearing part of the super-app moat. Hold the AI21 precedent for questions: Human or Not drew a reported ten million conversations in a month in 2023, then shut down. Appetite proven, surface abandoned. All of these are external claims from the research sweep, not our measurements."}, {"n": 3, "section": "DECOY", "kicker": "CARTRIDGE 01", "title": "Decoy: spot the machine in *30 seconds*", "layout": "split", "body": ["One real trending thread, pulled live from X", "Four real replies, read verbatim from the thread", "One Grok-written imposter hidden among them", "Two players race to tap the fake", "Reveal shows real authors and the imposter's rationale"], "highlights": [{"label": "Rounds built live", "value": "6"}, {"label": "Grok voice host lines", "value": "5"}, {"label": "Share card, Imagine", "value": "1"}], "chartRef": "loop", "figureRef": "", "equations": [], "notes": "This slide matches the lobby the judges will see: near-black, neon cyan, CRT scanlines, all CSS. The loop is one breath long. Real threads, pulled live: deedydas on AI, Cointelegraph on crypto, Variety on movies, DeadlineDayLive on sports. Four replies are read verbatim from the thread, with post URLs preserved in the round files under cartridges/decoy/rounds/. Grok writes the fifth in the same register. Thirty seconds on the clock, two players, first correct tap wins. At reveal the real handles come back and Grok explains how it faked the register. The host voice is Grok TTS, five lines pre-rendered at build time."}, {"n": 4, "section": "LIVE DEMO", "kicker": "TWO PLAYERS, ONE ROOM", "title": "Let's *play*", "layout": "title", "body": ["Room code GROK", "First correct tap wins"], "highlights": [{"label": "Room code", "value": "GROK"}, {"label": "On the clock", "value": "30s"}], "chartRef": "", "figureRef": "", "equations": [], "notes": "Stop talking and play. Open two tabs, both join room GROK, and the round starts the moment the second player joins. Hand a judge player two. If the venue network dies, the demo runs entirely offline from committed fixtures, and ?mock=1 puts the stage into a scripted state as the worst-case fallback."}, {"n": 5, "section": "HOW IT WORKS", "kicker": "X_SEARCH TO REVEAL", "title": "Live thread in, *five gates* before play", "layout": "chart", "body": [], "highlights": [{"label": "x_search probe", "value": "42s"}, {"label": "Image gen probe", "value": "6.5s"}, {"label": "TTS probe", "value": "1.78s"}, {"label": "Voice token mint", "value": "0.13s"}], "chartRef": "pipeline", "figureRef": "", "equations": [], "notes": "The pipeline in five beats. x_search finds a trending thread, a second grounded call reads its replies, and the builder rejects any response that made no x_search call. Grok writes the imposter. Five deterministic gates screen every round, fail closed, no override. The queue serves only clean rounds. The four numbers below are probes measured at build time, saved under artifacts/probes/. The 42 second x_search latency is exactly why rounds pre-build into a queue and are never fetched inline. The proof beat: integration_check.py plays a full two-player round offline with a socket guard active, zero network egress, trace at artifacts/integration_trace.txt. Voice runs browser-direct over an ephemeral token endpoint, minted in 0.13 seconds, and no secret ever reaches the client."}, {"n": 6, "section": "FLYWHEEL", "kicker": "THESIS, NOT A RESULT", "title": "Every guess is a *labeled judgment*", "layout": "split", "body": ["A guess marks which reply reads machine-written", "Wrong guesses flag real replies that read like bots", "Aggregate signal is what bot detection wants", "This is a thesis. No flywheel number is measured."], "highlights": [{"label": "Labeled as such", "value": "Thesis"}, {"label": "Flywheel metrics measured", "value": "0"}], "chartRef": "flywheel", "figureRef": "", "equations": [], "notes": "Label this slide honestly and it gets stronger, not weaker. Every guess is a human judgment about what reads as machine-written, attached to real content, at game speed. Correct guesses say this text reads human. Wrong guesses are the interesting half: a real person whose reply reads like a bot. Aggregated, that is the labeled signal a bot-detection stack is starved for, the 208-a-minute problem from the first slide. We have measured none of it. The claim is that the loop exists and the game produces the labels as a side effect of being fun."}, {"n": 7, "section": "PLATFORM", "kicker": "CARTRIDGES + GATES", "title": "One cabinet, *many cartridges*", "layout": "split", "body": ["A cartridge ships rounds behind one small contract", "The cabinet runs rooms, scoring, voice, share cards", "Gates are platform infrastructure, not per-game code", "They rejected 1 of 6 rounds built", "Second cartridge Crux exists as a sketch"], "highlights": [{"label": "Rounds rejected", "value": "1/6"}, {"label": "Gates, fail closed", "value": "5"}], "chartRef": "gates", "figureRef": "", "equations": [], "notes": "The platform claim rests on the seam. A cartridge ships rounds that satisfy one small contract in CONTRACT.md, and the cabinet supplies rooms, websocket state, scoring, the voice host, and the share card forge. The gates are what judges should remember: they run at load, deterministic, fail closed, and they proved themselves on real content, rejecting the AI-topic round on G_SOURCE and G_URL failures, so five of six rounds serve. A rejected round is not a bug. It is the screen working. Crux, the second cartridge, exists as a sketch only and is claimed as exactly that."}, {"n": 8, "section": "BUSINESS", "kicker": "PROJECTIONS, LABELED", "title": "Sponsored arenas, *shareable wins*", "layout": "split", "body": ["Brands sponsor topic arenas with a light skin", "The winner's share card carries the sponsor mark", "Gates screen every round before a brand touches it", "All revenue figures are illustrative, none are measured"], "highlights": [], "chartRef": "", "figureRef": "share_card", "equations": [], "notes": "Two ad surfaces fall out of the game. Sponsored arenas: a brand picks a topic, gets an accent color and its name on the arena, and the game stays identical. The share card: the winner's card carries the sponsor mark, so every share is brand reach next to the topic the brand chose. The ad module ships with its cpm_note field set to the literal string ILLUSTRATIVE so no invented market figure appears anywhere, and every sponsor name in the demo config is fictional. To be plain: any revenue number attached to this idea is a projection. The safety gates run before any arena is served, which is the brand-safety answer an ads buyer needs first."}, {"n": 9, "section": "CLOSE", "kicker": "THE ASK", "title": "Built in *a day* on the API", "layout": "closing", "body": ["Code: github.com/arunshar/x-arcade-grokathon, public, MIT", "Built before this event", "Post-back and video are staged, said openly", "The ask: ship one cartridge on X, measure the flywheel"], "highlights": [{"label": "License", "value": "MIT"}, {"label": "On the xAI API", "value": "1 day"}], "chartRef": "", "figureRef": "", "equations": [], "notes": "Close on candor. The whole thing was built before the event, on the xAI API surfaces: x_search, Grok 4.5 text, Imagine image, Grok voice TTS. What is real: live rounds from real threads, two-player websocket rooms, gates that rejected real content, and an offline proof with zero network egress. What is staged and stated as staged: the post-back to X and the pre-generated video. The ask is small and concrete: ship one cartridge behind a real X surface and instrument the guess stream to test the flywheel thesis for real."}],CHARTS={"gates": {"kind": "table", "head": ["Gate", "What it checks"], "rows": [["G_SOURCE", "post and all 5 replies present, within length bounds"], ["G_SLURS", "denylist scan over the post and every reply"], ["G_DECOY_COUNT", "exactly one imposter, and the round points at it"], ["G_AUTHOR", "real replies carry real handles, never the decoy marker"], ["G_URL", "no links in reply text"]]}, "loop": {"kind": "loop"}, "pipeline": {"kind": "pipeline"}, "flywheel": {"kind": "flywheel"}},FIGURES={"share_card": {"src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/6zSNSlACEQAAAAEAADSDanVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAANF1qdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOmU4OWY2ZWJkLTJkZGQtNDZmYi1hNzVmLTRiZmYzNGZmNDExOQAAAAJYanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAA5Wp1bWIAAABBanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5hY3Rpb25zLnYyAAAAABhjMnNoSNCIBt083kDtrJz+A37ClwAAAJxjYm9yoWdhY3Rpb25zgaNmYWN0aW9ubGMycGEuY3JlYXRlZG1zb2Z0d2FyZUFnZW50bEdyb2sgSW1hZ2luZXFkaWdpdGFsU291cmNlVHlwZXhGaHR0cDovL2N2LmlwdGMub3JnL25ld3Njb2Rlcy9kaWdpdGFsc291cmNldHlwZS90cmFpbmVkQWxnb3JpdGhtaWNNZWRpYQAAAH9qdW1iAAAARGp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuY3JlYXRpdmVfd29yawAAAAAYYzJzaK5QOnhIdo2n7B6zafJM3GoAAAAzY2JvcqFmYXV0aG9ygaJlQHR5cGVsT3JnYW5pemF0aW9uZG5hbWVoU3BhY2VYQUkAAADDanVtYgAAAEBqdW1kY2JvcgARABCAAACqADibcRNjMnBhLmhhc2guZGF0YQAAAAAYYzJzaOp5mKJBfog9onxnA5KjjBsAAAB7Y2JvcqVqZXhjbHVzaW9uc4GiZXN0YXJ0FGZsZW5ndGgZNI9kbmFtZW5qdW1iZiBtYW5pZmVzdGNhbGdmc2hhMjU2ZGhhc2hYIBfAmWN/XM1TIhazx9HiddvohuwjEuXvV1ToCpIn2gMSY3BhZEkAAAAAAAAAAAAAAAKIanVtYgAAACdqdW1kYzJjbAARABCAAACqADibcQNjMnBhLmNsYWltLnYyAAAAAlljYm9yp2ppbnN0YW5jZUlEeCx4bXA6aWlkOmIxY2RhODJlLWNiODctNDUxNy05MWUyLTI1MWRjMDcyZTQwN3RjbGFpbV9nZW5lcmF0b3JfaW5mb6NkbmFtZWdjMnBhLXJzZ3ZlcnNpb25mMC43Ni4yd29yZy5jb250ZW50YXV0aC5jMnBhX3JzZjAuNzYuMmlzaWduYXR1cmV4TXNlbGYjanVtYmY9L2MycGEvdXJuOmMycGE6ZTg5ZjZlYmQtMmRkZC00NmZiLWE3NWYtNGJmZjM0ZmY0MTE5L2MycGEuc2lnbmF0dXJlcmNyZWF0ZWRfYXNzZXJ0aW9uc4GiY const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function box(x,y,w,h,label,sub,hue='accent'){
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(--bgAlt)" stroke="var(--${hue})" stroke-width="1.5"/>

}
function arrow(x1,y1,x2,y2,hue='grid'){
  return `<path d="M ${x1} ${y1} L ${x2} ${y2}" stroke="var(--${hue})" stroke-width="2" fill="none" marker-end="url(#arr)"/>`;
}
function frame(body,W=960,H=360){return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="var(--inkDim)"/></marker></defs>${body}</svg>`;}
function gameLoop(){
  let g=box(130,10,300,66,'REAL THREAD','pulled live from X','accent');
  g+=box(130,104,300,66,'4 REAL + 1 GROK','imposter hidden by seed','pigrpo');
  g+=box(130,198,300,66,'30-SECOND RACE','two players, first tap wins','accent');
  g+=box(130,292,300,66,'REVEAL','real authors + decoy rationale','good');
  g+=arrow(280,76,280,104)+arrow(280,170,280,198)+arrow(280,264,280,292);
  return frame(g,560,368);
}
function pipeline(){
  const xs=[18,205,392,579,766],labels=[
    ['1 · X_SEARCH','find a live thread'],['2 · REPLIES','4 real, read verbatim'],['3 · IMPOSTER','Grok writes one'],
    ['4 · GATES','5 checks, fail closed'],['5 · QUEUE','only clean rounds serve']];
  let g='';
  xs.forEach((x,i)=>{g+=box(x,105,176,92,labels[i][0],labels[i][1],i===3?'pigrpo':(i===4?'good':'accent'));if(i<4)g+=arrow(x+176,151,xs[i+1],151);});
  g+=`<text x="480" y="255" text-anchor="middle" fill="var(--inkDim)" font-family="var(--fm)" font-size="13">Gates rejected 1 of 6 rounds built today (G_SOURCE + G_URL), so 5 serve</text>`;
  g+=`<text x="480" y="282" text-anchor="middle" fill="var(--inkDim)" font-family="var(--fm)" font-size="13">Proven offline: full two-player round, zero network egress (artifacts/integration_trace.txt)</text>`;
  return frame(g);
}
function flywheel(){
  let g=box(155,10,250,62,'PLAYERS GUESS','30-second rounds','accent');
  g+=box(305,150,245,62,'LABELED SIGNAL','human judgments, aggregated','pcrf');
  g+=box(155,290,250,62,'BOT DETECTION','the consumer of the signal','good');
  g+=box(10,150,245,62,'SHARPER DECOYS','harder rounds, more fun','pigrpo');
  g+=arrow(355,72,420,150)+arrow(420,212,355,290)+arrow(205,290,140,212)+arrow(140,150,205,72);
  return frame(g,560,368);
}
function bars(c){
  const W=560,H=330,left=120,top=38,max=Math.max(...c.bars.map(b=>b.value)),avail=355;
  let g='';
  c.bars.forEach((b,i)=>{const y=top+i*84,w=Math.max(8,avail*b.value/max);g+=`<g>
    <text x="${left-16}" y="${y+26}" text-anchor="end" fill="var(--inkDim)" font-family="var(--fh)" font-size="16">${esc(b.label)}</text>
    <rect x="${left}" y="${y}" width="${w}" height="34" rx="6" fill="var(--${b.hue})"/>
    <text x="${left+w+12}" y="${y+24}" fill="var(--ink)" font-family="var(--fm)" font-size="15" font-weight="600">${esc(b.detail)}</text></g>`;});
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg><div class="cap">${esc(c.caption)}</div>`;
}
function table(c){let h='<table class="tbl"><thead><tr>'+c.head.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>';
  c.rows.forEach(r=>{h+='<tr>'+r.map(x=>`<td>${esc(x)}</td>`).join('')+'</tr>';});return h+'</tbody></table>';}
function renderChart(ref){const c=CHARTS[ref];if(!c)return'';let content='';
  if(c.kind==='table')content=table(c);else if(c.kind==='bars')content=bars(c);else if(c.kind==='loop')content=gameLoop();
  else if(c.kind==='pipeline')content=pipeline();else if(c.kind==='flywheel')content=flywheel();
  return `<div class="chartWrap">${content}</div>`;}
function blockBody(s){return s.body?.length?`<ul class="body">${s.body.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:'';}
function blockHighlights(s){return s.highlights?.length?`<div class="hl">${s.highlights.map(h=>`<div class="stat"><span class="v">${esc(h.value)}</span><span class="l">${esc(h.label)}</span></div>`).join('')}</div>`:'';}
function blockFigure(s){if(!s.figureRef)return'';const f=FIGURES[s.figureRef];return `<div class="figWrap"><img src="${f.src}" alt="X Arcade share card"/><div class="cap">${esc(f.cap)}</div></div>`;}
function buildSlide(s,i,total){const el=document.createElement('section');el.className='slide layout-'+s.layout;el.style.setProperty('--sys','var(--accent)');
  const kick=`<div class="kicker"><span class="dot"></span>${esc(s.kicker||s.section)}</div>`;
  const title=`<h1 class="title">${emph(s.title)}</h1><div class="titleRule"></div>`;let mid='';
  if(s.layout==='title')mid=`<div class="sub">${s.body.map(esc).join(' · ')}</div>`+blockHighlights(s);
  else if(s.layout==='split')mid=`<div class="split"><div class="col-l">${blockBody(s)}</div><div class="col-r">${s.figureRef?blockFigure(s):renderChart(s.chartRef)}</div></div>`+blockHighlights(s);
  else if(s.layout==='chart')mid=renderChart(s.chartRef)+blockHighlights(s);
  else if(s.layout==='figure')mid=blockFigure(s)+blockBody(s);
  else mid=blockBody(s)+blockHighlights(s);
  el.innerHTML=kick+title+mid+`<div class="foot"><span class="sec">${esc(s.section)}</span><span>${String(i+1).padStart(2,'0')} / ${total}</span></div>`;return el;}
let idx=0;const total=SLIDES.length,slideEls=[];SLIDES.forEach((s,i)=>{const e=buildSlide(s,i,total);stage.appendChild(e);slideEls.push(e);});
const notesEl=document.getElementById('notes'),notesBody=document.getElementById('notesBody'),counter=document.getElementById('counter'),progress=document.getElementById('progress');
function show(n){idx=Math.max(0,Math.min(total-1,n));slideEls.forEach((e,i)=>e.classList.toggle('active',i===idx));counter.textContent=(idx+1)+' / '+total;progress.style.width=((idx+1)/total*100)+'%';notesBody.textContent=SLIDES[idx].notes||'';try{location.hash=idx+1}catch(e){}}
function fit(){const sx=innerWidth/1280,sy=innerHeight/720;stage.style.transform='scale('+Math.min(sx,sy)+')';}
addEventListener('resize',fit);document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){show(idx+1);e.preventDefault()}else if(['ArrowLeft','PageUp'].includes(e.key))show(idx-1);else if(e.key==='Home')show(0);else if(e.key==='End')show(total-1);else if(['n','N'].includes(e.key))notesEl.classList.toggle('show');else if(['f','F'].includes(e.key)){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}else if(['p','P'].includes(e.key))print();});
let tx=0,ty=0;stage.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4)show(idx+(dx<0?1:-1))},{passive:true});
['prev','next'].forEach(d=>{const b=document.createElement('div');b.className='navbtn';b.id=d+'Btn';b.textContent=d==='prev'?'‹':'›';b.addEventListener('click',e=>{e.stopPropagation();show(idx+(d==='next'?1:-1))});document.body.appendChild(b)});
let dismissed=false;const hint=document.getElementById('rotateHint');document.getElementById('rhDismiss').addEventListener('click',()=>{dismissed=true;hint.style.display='none'});function orient(){hint.style.display=(innerHeight>innerWidth&&Math.min(innerWidth,innerHeight)<560&&!dismissed)?'flex':'none'}addEventListener('resize',orient);fit();orient();show(parseInt(location.hash.slice(1))-1||0);
</script>
</body>
</html>
